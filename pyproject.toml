[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findevil"
version = "0.1.0"
description = "Evidence-Contract Autonomous IR Agent for SANS FIND EVIL! Hackathon"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
]

[project.scripts]
findevil = "findevil.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
